<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI-TIMING</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--brand:#4f46e5;--kitchen:#d97706;--service:#2563eb;--plonge:#0d9488;--hotesse:#db2777;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
#app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px}
.brand .logo{font-size:26px}.brand-name{font-weight:700;color:#fff;font-size:16px}.brand-sub{font-size:11px;color:#94a3b8}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cbd5e1;text-decoration:none;font-weight:500;cursor:pointer}
#nav a:hover{background:#1e293b;color:#fff}#nav a.active{background:var(--brand);color:#fff}
.sidebar-foot{margin-top:auto;font-size:11px;color:#64748b;padding:10px 6px 0;display:flex;flex-direction:column;gap:6px}
.sidebar-foot button{width:100%;font-size:12px;background:#1e293b;color:#cbd5e1;border:none}
.sidebar-foot button:hover{background:#334155;color:#fff}
#main{flex:1;padding:26px 30px;max-width:1200px}
#app-foot{text-align:center;padding:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel)}
@media print{.sidebar,#app-foot{display:none}#app{display:block}#main{max-width:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0}.page-head p{color:var(--muted);margin:4px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
input[type=checkbox]{width:16px;height:16px}
.check{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600}
button:hover{background:#f1f5f9}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
button.primary:hover{filter:brightness(1.08)}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.danger{background:#fff;color:var(--bad);border-color:#fecaca}button.danger:hover{background:#fef2f2}
button.sm{padding:4px 8px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}tr:hover td{background:#fafbfc}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.tag.kitchen{background:#fef3c7;color:#92400e}.tag.service{background:#dbeafe;color:#1e40af}.tag.plonge{background:#ccfbf1;color:#0f766e}.tag.hotesse{background:#fce7f3;color:#9d174d}.tag.both{background:#ede9fe;color:#5b21b6}
.board{overflow-x:auto}.board table{min-width:900px}.board th.day{text-align:center}
.cell-shift{display:block;margin:3px 0;padding:4px 7px;border-radius:6px;font-size:12px;border-left:3px solid;background:#f8fafc}
.cell-shift.kitchen{border-color:var(--kitchen)}.cell-shift.service{border-color:var(--service)}.cell-shift.plonge{border-color:var(--plonge)}
.cell-shift .time{font-weight:700}.cell-empty{color:#cbd5e1}
/* Grille calendrier (heures x jours) */
.cal{overflow-x:auto;padding-bottom:6px}
.cal-head{display:grid;grid-template-columns:52px repeat(7,minmax(96px,1fr));margin-bottom:2px}
.cal-head .ch{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-body{display:grid;grid-template-columns:52px repeat(7,minmax(96px,1fr))}
.cal-axis{position:relative}
.cal-axis .hr{position:absolute;left:0;right:4px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(-6px)}
.cal-col{position:relative;border-left:1px solid var(--line)}
.cal-col:last-child{border-right:1px solid var(--line)}
.cal-line{position:absolute;left:0;right:0;border-top:1px solid #eef1f5}
.cal-block{position:absolute;border-radius:6px;padding:3px 5px;font-size:11px;color:#fff;overflow:hidden;box-shadow:var(--shadow);line-height:1.2}
.cal-block .bn{font-weight:700}.cal-block .bt{opacity:.9;font-size:10px}
.cal-block.kitchen{background:var(--kitchen)}.cal-block.service{background:var(--service)}.cal-block.plonge{background:var(--plonge)}.cal-block.hotesse{background:var(--hotesse)}
/* Grille jour par jour (jours empilés, chacun avec sa propre plage horaire) */
.day-row{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}
.day-row:last-child{border-bottom:none}
.day-label{width:96px;flex:none;font-weight:700;font-size:13px}
.day-label .sub{font-weight:400;color:var(--muted);font-size:11px}
.day-track-wrap{flex:1;overflow-x:auto}
.day-track{position:relative;min-height:34px}
.day-hour{position:absolute;top:0;bottom:0;border-left:1px solid #eef1f5}
.day-hour .lab{position:absolute;top:0;left:3px;font-size:10px;color:var(--muted)}
.day-block{position:absolute;border-radius:6px;color:#fff;font-size:11px;font-weight:600;padding:2px 6px;overflow:hidden;white-space:nowrap;box-shadow:var(--shadow);line-height:1.5}
.day-block.kitchen{background:var(--kitchen)}.day-block.service{background:var(--service)}.day-block.plonge{background:var(--plonge)}.day-block.hotesse{background:var(--hotesse)}
.day-block.edited{outline:2px solid #0f172a;outline-offset:1px}
.day-label .add-shift{margin-top:5px;padding:2px 7px;font-size:11px;background:#eef2ff;color:var(--brand);border-color:#c7d2fe}
.day-label .add-shift:hover{background:#e0e7ff}
.hm-row{display:flex;align-items:center;gap:8px;margin:2px 0}
.hm-day{width:60px;flex:none;font-size:11px;font-weight:700;color:#334155}
.hm-day .sub{font-weight:400;color:var(--muted);font-size:10px}
.hm-cells{display:flex;gap:1px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.hm-cell{width:20px;height:20px;flex:none;font-size:10px;display:flex;align-items:center;justify-content:center;color:#475569;border-radius:2px}
.hm-cell.hm-hr{box-shadow:inset 1px 0 0 #94a3b8}
.cand-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:4px}
.cand-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.cand-row:last-child{border-bottom:none}
.cand-row.ok{background:#f0fdf4}.cand-row.warn{background:#fffbeb}.cand-row.block{background:#fef2f2}
.cand-name{font-weight:600;min-width:150px}
.cand-meta{color:var(--muted);font-size:11px;min-width:120px}
.cand-badges{margin-left:auto;font-size:12px;text-align:right}
.day-closed{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.badge.DRAFT{background:#fef9c3;color:#854d0e}.badge.APPROVED{background:#dcfce7;color:#166534}
.warn-box{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.ok-box{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.cov-grid{overflow-x:auto}.cov-grid table{min-width:700px}.cov-grid th,.cov-grid td{text-align:center;padding:4px 5px}
.cov-grid input{width:46px;text-align:center;padding:5px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.spacer{flex:1}.pill-hours{font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:all .25s;pointer-events:none;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.bad{background:#b91c1c}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:14px;padding:22px;width:660px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal h2{margin-top:0}.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
</style>

<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🗓️</span><div><div class="brand-name">AI-TIMING</div></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button id="btnExport">⬇ Exporter mes données</button>
      <button id="btnImport">⬆ Importer</button>
      <button id="btnReset">↺ Données de démo</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<footer id="app-foot">© 2026 Eric Gloutnez — Tous droits réservés</footer>
<div id="toast" class="toast"></div>
<input type="file" id="fileImport" accept="application/json" style="display:none" />
<script>
// ===========================================================================
//  AI-TIMING — application de test autonome (fonctionne sans serveur)
//  Édition + sauvegarde locale + génération. Même moteur que la version finale.
// ===========================================================================

// ---- Moteur d'assignation --------------------------------------------------
const DAY_MIN=1440;
function minutesToHHMM(m){const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function hhmmToMin(s){if(!s)return 0;const[h,m]=s.split(':').map(Number);return h*60+(m||0);}
function dayOfWeek(s){return new Date(s+'T00:00:00Z').getUTCDay();}
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function mondayOf(s){const d=dayOfWeek(s);return addDays(s,d===0?-6:-(d-1));}
function todayStr(){return new Date().toISOString().slice(0,10);}
function weekDatesFrom(s){return Array.from({length:7},(_,i)=>addDays(s,i));}
function frDate(s){const d=new Date(s+'T00:00:00Z');return DOW_SHORT[d.getUTCDay()]+' '+d.getUTCDate();}

function generateSchedule(input){
  const{weekDates=[],departments=[],employees=[],availability={},timeOff=[],openingHoursByDate={},coverageByDate={},options={}}=input;
  const gran=30;const oneShiftPerDay=options.oneShiftPerDay!==false; // résolution de base : 30 minutes
  const timeOffSet=new Set(timeOff.map(t=>t.employeeId+'|'+t.date));
  // On ignore toute couverture demandée HORS des heures d'ouverture (avant l'ouverture ou à/après la fermeture) :
  // un quart ne peut pas dépasser la fermeture, donc ces créneaux seraient des trous impossibles à combler.
  const need={};for(const date of weekDates){need[date]={};const cov=coverageByDate[date]||{};for(const dept of departments){const ph=cov[dept.id]||{};need[date][dept.id]={};const open=(openingHoursByDate[date]||{})[dept.id];for(const h of Object.keys(ph)){const hn=Number(h);if(open&&hn>=open.open&&hn<open.close)need[date][dept.id][hn]=ph[h];}}}
  const assignments=[],empWeekMin={},empDays={},empDayShift={};
  for(const e of employees){empWeekMin[e.id]=0;empDays[e.id]=new Set();empDayShift[e.id]={};}
  const sorted=[...employees].filter(e=>e.active!==false).sort((a,b)=>(a.rank??9999)-(b.rank??9999));
  const slotsInRange=(s,e)=>{const l=[];for(let t=Math.floor(s/30)*30;t<e;t+=30)l.push(t);return l;}; // créneaux de 30 min couverts
  const restOk=(emp,date,start,end)=>{const mr=(emp.minRestHours??0)*60;if(mr<=0)return true;const i=weekDates.indexOf(date),p=weekDates[i-1],n=weekDates[i+1];
    if(p&&empDayShift[emp.id][p]&&(DAY_MIN-empDayShift[emp.id][p].end+start)<mr)return false;
    if(n&&empDayShift[emp.id][n]&&(DAY_MIN-end+empDayShift[emp.id][n].start)<mr)return false;return true;};
  const bestForDate=(emp,date)=>{
    if(oneShiftPerDay&&empDayShift[emp.id][date])return null;
    if(timeOffSet.has(emp.id+'|'+date))return null;
    if(empDays[emp.id].size>=(emp.maxDaysPerWeek??7)&&!empDays[emp.id].has(date))return null;
    const dow=dayOfWeek(date);const wins=(availability[emp.id]||{})[dow]||[];if(!wins.length)return null;
    const minLen=(emp.minShiftHours??3)*60,maxLen=(emp.maxShiftHours??8)*60;
    const rem=(emp.maxHoursPerWeek??40)*60-empWeekMin[emp.id];if(rem<minLen)return null;
    let best=null;
    for(const deptId of(emp.departments||[])){const open=(openingHoursByDate[date]||{})[deptId];if(!open)continue;const nm=(need[date]||{})[deptId]||{};
      for(const w of wins){const uS=Math.max(w.start,open.open),uE=Math.min(w.end,open.close);if(uE-uS<minLen)continue;
        const s0=Math.ceil(uS/gran)*gran;
        for(let s=s0;s+minLen<=uE;s+=gran){const mE=Math.min(s+maxLen,uE,s+rem);
          for(let e=s+minLen;e<=mE;e+=gran){if(!restOk(emp,date,s,e))continue;let uc=0,ov=0;
            for(const h of slotsInRange(s,e)){if((nm[h]??0)>0)uc++;else ov++;}const sc=uc-0.15*ov;
            if(uc>0&&(!best||sc>best.score+1e-9||(Math.abs(sc-best.score)<1e-9&&e-s<best.end-best.start)||(Math.abs(sc-best.score)<1e-9&&e-s===best.end-best.start&&s<best.start)))best={deptId,start:s,end:e,score:sc,win:{start:w.start,end:w.end},open:{open:open.open,close:open.close}};}}}}
    return best;};
  const bestForWeek=(emp)=>{let best=null;for(const date of weekDates){const s=bestForDate(emp,date);if(s&&(!best||s.score>best.score))best={...s,date};}return best;};
  // Saturation par rang : chaque employé (dans l'ordre de rang) réclame TOUS les jours disponibles
  // qu'il peut couvrir (selon ses limites max heures/jours, repos, 1 quart/jour) AVANT de passer
  // à l'employé de rang inférieur. Ainsi le rang 1 est toujours choisi en premier sur ses quarts dispo.
  for(const emp of sorted){let guard=0;
    while(guard++<1000){
      if((emp.maxHoursPerWeek??40)*60-empWeekMin[emp.id]<(emp.minShiftHours??3)*60)break;
      const sh=bestForWeek(emp);if(!sh)break;const{date}=sh;
      const weeklyBefore=empWeekMin[emp.id],daysBefore=empDays[emp.id].size;
      let slotsFilled=0;for(const t of slotsInRange(sh.start,sh.end)){const nm=need[date][sh.deptId];if((nm[t]??0)>0){nm[t]--;slotsFilled++;}}
      const why={rank:emp.rank,order:assignments.length+1,slotsFilled,win:sh.win,open:sh.open,maxShiftMin:(emp.maxShiftHours??8)*60,minShiftMin:(emp.minShiftHours??3)*60,minRestH:emp.minRestHours??0,maxDays:emp.maxDaysPerWeek??7,daysBefore,weeklyBefore,weeklyMax:(emp.maxHoursPerWeek??40)*60};
      assignments.push({employeeId:emp.id,departmentId:sh.deptId,date,start:sh.start,end:sh.end,_why:why});
      empDayShift[emp.id][date]={start:sh.start,end:sh.end};empDays[emp.id].add(date);empWeekMin[emp.id]+=sh.end-sh.start;}}
  const unmet=[];const employeeHours={};for(const e of employees)employeeHours[e.id]=empWeekMin[e.id]||0;
  for(const date of weekDates)for(const dept of departments){const req=(coverageByDate[date]||{})[dept.id]||{};
    for(const h of Object.keys(req).map(Number)){const sn=need[date][dept.id][h]??0;if(sn>0)unmet.push({date,departmentId:dept.id,hour:h,missing:sn});}}
  const warnings=[];
  if(unmet.length){const tm=unmet.reduce((s,u)=>s+u.missing,0);warnings.push(tm+' heure(s)-personne non couvertes sur '+unmet.length+' plage(s). Ajuste les disponibilités ou ajoute du personnel.');}
  return{assignments,unmet,employeeHours,warnings};
}

// ---- Constantes ------------------------------------------------------------
const H=(h,m=0)=>h*60+m;
const DOW=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const DOW_SHORT=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const DOW_ORDER=[1,2,3,4,5,6,0]; // affichage : lundi -> dimanche
const DEPTS=[{id:'kitchen',key:'kitchen',name:'Cuisine'},{id:'service',key:'service',name:'Service'},{id:'plonge',key:'plonge',name:'Plonge'},{id:'hotesse',key:'hotesse',name:'Hôtesse'}];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const empDoes=(e,key)=>!!e['does'+cap(key)];

// ---- Données par défaut (démo) --------------------------------------------
function defaultState(){
  const openByDow={0:[H(10),H(21)],1:[H(11),H(22)],2:[H(11),H(22)],3:[H(11),H(22)],4:[H(11),H(22)],5:[H(11),H(23)],6:[H(11),H(23)]};
  // Colonnes : prénom, nom, rang, cuisine, service, type, hMin, hMax, joursMax, plonge
  const employees=[
   ['Alice','Tremblay',1,true,true,'FULL_TIME',35,40,5,false],['Bruno','Lavoie',2,true,false,'FULL_TIME',35,40,5,true],
   ['Chloé','Moreau',3,false,true,'FULL_TIME',30,40,5,false],['David','Roy',4,true,true,'FULL_TIME',30,40,5,true],
   ['Emma','Gagnon',5,false,true,'PART_TIME',20,32,4,false],['Félix','Bergeron',6,true,false,'PART_TIME',20,32,4,true],
   ['Gabrielle','Côté',7,false,true,'PART_TIME',15,30,4,false],['Hugo','Fortin',8,true,true,'PART_TIME',15,30,4,true],
   ['Inès','Bouchard',9,false,true,'PART_TIME',10,24,3,false],['Jacob','Girard',10,true,false,'PART_TIME',10,24,3,true],
   ['Kim','Pelletier',11,true,true,'PART_TIME',8,20,3,true],['Louis','Bélanger',12,false,true,'PART_TIME',6,16,2,false],
  ].map((a,i)=>{const av={};for(let d=0;d<7;d++)av[d]=[{start:H(8),end:H(23,59)}];
    return{id:'e'+(i+1),firstName:a[0],lastName:a[1],rank:a[2],active:true,doesKitchen:a[3],doesService:a[4],doesPlonge:!!a[9],doesHotesse:[2,4,6].includes(i),employmentType:a[5],
      minHoursPerWeek:a[6],maxHoursPerWeek:a[7],minShiftHours:4,maxShiftHours:8,minRestHours:10,maxDaysPerWeek:a[8],availability:av};});
  const openingHours={};const coverage={};
  for(const dept of DEPTS){openingHours[dept.key]={};coverage[dept.key]={};
    for(let d=0;d<7;d++){const[o,c]=openByDow[d];openingHours[dept.key][d]={closed:false,open:o,close:c};
      const hrs={};for(let t=o;t<c;t+=30){const h=t/60;hrs[t]=dept.key==='kitchen'?2:dept.key==='plonge'?1:dept.key==='hotesse'?1:(h<15?1:2);}coverage[dept.key][d]=hrs;}}
  const shiftTemplates=[
    {id:'t1',label:'Ouverture Service',deptKey:'service',start:H(11),end:H(16)},
    {id:'t2',label:'Fermeture Service',deptKey:'service',start:H(16),end:H(22)},
    {id:'t3',label:'Journée Cuisine',deptKey:'kitchen',start:H(11),end:H(21)},
    {id:'t4',label:'Soir Plonge',deptKey:'plonge',start:H(17),end:H(22)},
  ];
  return{employees,openingHours,coverage,coverageVersions:[{id:'base',effectiveFrom:'2000-01-01',label:'Configuration de base',coverage}],timeOff:[],extraAvail:[],shiftTemplates,settings:{granularityMin:30,oneShiftPerDay:true},weekStart:mondayOf(todayStr())};
}

// ---- Stockage --------------------------------------------------------------
const KEY='horaire-ia-state-v1';
let memState=null;
// Convertit une couverture au format horaire (clés 0-23) vers des créneaux de
// 30 min (clés en minutes). Idempotent : ne retouche pas ce qui est déjà au bon format.
function migrateCoverage(cov){if(!cov)return;for(const dept of DEPTS){const dd=cov[dept.key];if(!dd)continue;
  for(const dow of Object.keys(dd)){const day=dd[dow]||{};const keys=Object.keys(day);
    if(keys.length&&keys.every(k=>Number(k)<24)){const nd={};for(const k of keys){const h=Number(k),v=day[k];nd[h*60]=v;nd[h*60+30]=v;}dd[dow]=nd;}}}}
// Migration douce : garantit que chaque département (ex. plonge ajoutée) a ses
// heures et sa couverture, sans écraser les données déjà saisies.
function normalize(st){const def=defaultState();st.openingHours=st.openingHours||{};st.coverage=st.coverage||{};
  for(const dept of DEPTS){if(!st.openingHours[dept.key])st.openingHours[dept.key]=def.openingHours[dept.key];
    if(!st.coverage[dept.key])st.coverage[dept.key]=def.coverage[dept.key];}
  st.employees=(st.employees||[]).map(e=>{const c={...e};for(const d of DEPTS)if(c['does'+cap(d.key)]===undefined)c['does'+cap(d.key)]=false;return c;});
  st.timeOff=st.timeOff||[];st.extraAvail=st.extraAvail||[];st.prestoLog=st.prestoLog||[];if(!st.shiftTemplates)st.shiftTemplates=def.shiftTemplates||[];st.settings=st.settings||def.settings;
  // Couverture à dates d'effet : au moins une version « de base ».
  st.coverage=st.coverage||def.coverage;
  if(!st.coverageVersions||!st.coverageVersions.length)st.coverageVersions=[{id:'base',effectiveFrom:'2000-01-01',label:'Configuration de base',coverage:st.coverage}];
  for(const v of st.coverageVersions){v.coverage=v.coverage||{};for(const dept of DEPTS){if(!v.coverage[dept.key])v.coverage[dept.key]=def.coverage[dept.key];}}
  st.coverageVersions.sort((a,b)=>a.effectiveFrom.localeCompare(b.effectiveFrom));
  migrateCoverage(st.coverage);for(const v of st.coverageVersions)migrateCoverage(v.coverage); // horaire -> 30 min
  return st;}
// Couverture applicable à une date : dernière version dont la date d'effet <= date.
function coverageForDate(date){let best=null;for(const v of state.coverageVersions){if(v.effectiveFrom<=date&&(!best||v.effectiveFrom>best.effectiveFrom))best=v;}return (best||state.coverageVersions[0]).coverage;}

// Répartition des quarts qui se chevauchent en « couloirs » côte à côte.
function layoutLanes(shifts){const sorted=[...shifts].sort((a,b)=>a.start-b.start||a.end-b.end);const laneEnds=[];const res=[];
  for(const s of sorted){let lane=laneEnds.findIndex(e=>e<=s.start);if(lane===-1){lane=laneEnds.length;laneEnds.push(s.end);}else laneEnds[lane]=s.end;res.push({s,lane});}
  return{res,lanes:laneEnds.length||1};}

// Explique pourquoi un quart a été attribué (clic sur un quart).
function explainShift(a,emp,dept,date){
  const nm=emp?emp.firstName+' '+emp.lastName:'?';const w=a._why;
  const content=el('div',{});
  content.appendChild(el('p',{},el('strong',{},nm),' — '+dept.name+', '+DOW[dayOfWeek(date)]+' '+date+', '+minutesToHHMM(a.start)+'–'+minutesToHHMM(a.end)+'.'));
  if(!w){content.appendChild(el('div',{class:'warn-box'},'Cet horaire a été généré avant l’ajout de l’explication (ou ce quart a été modifié à la main). Le détail du choix n’est pas disponible, mais voici la situation des autres employés.'));content.appendChild(whyNotOthers(a,dept,date));modal('Pourquoi ce quart ?',content,(c)=>c(),'OK');return;}

    '👤 Priorité : '+nm+' a le rang '+w.rank+'. Le moteur assigne par ordre de rang (rang 1 en premier). À son tour, ce bloc était son meilleur choix cette semaine.',
    '🎯 Utilité : ce quart comble '+w.slotsFilled+' créneau(x) de 30 min encore requis en '+dept.name+' — c’est ce qui a déterminé cette journée et ces heures.',
    '⏱️ Durée : '+durH+' h (quart min '+(w.minShiftMin/60)+' h, max '+(w.maxShiftMin/60)+' h).',
    '📅 Ce jour-là : disponibilité '+minutesToHHMM(w.win.start)+'–'+minutesToHHMM(w.win.end)+' · ouverture '+dept.name+' '+minutesToHHMM(w.open.open)+'–'+minutesToHHMM(w.open.close)+'.',
    '📊 Charge : '+(w.weeklyBefore/60).toFixed(1)+' h déjà placées avant ce quart (max '+(w.weeklyMax/60)+' h/sem.) · '+w.daysBefore+' jour(s) déjà travaillé(s) (max '+w.maxDays+').',
  ];
  let endReason;
  if(a.end>=w.open.close)endReason='la fermeture du département ('+minutesToHHMM(w.open.close)+')';
  else if(a.end>=w.win.end)endReason='la fin de sa disponibilité ('+minutesToHHMM(w.win.end)+')';
  else if(a.end-a.start>=w.maxShiftMin)endReason='la durée maximale de quart ('+(w.maxShiftMin/60)+' h)';
  else if(w.weeklyBefore+(a.end-a.start)>=w.weeklyMax)endReason='son maximum d’heures par semaine';
  else endReason='qu’au-delà, la couverture était déjà comblée (inutile d’ajouter du personnel)';
  lines.push('🔚 Fin à '+minutesToHHMM(a.end)+' : limitée par '+endReason+'.');
  for(const l of lines)content.appendChild(el('p',{style:'margin:8px 0'},l));
  content.appendChild(whyNotOthers(a,dept,date));
  content.appendChild(el('div',{class:'muted small',style:'margin-top:10px'},'Le moteur est déterministe : mêmes données → même horaire. Pour modifier ce quart : ajuste le rang, la disponibilité, la couverture, les congés ou l’alternance.'));
  modal('Pourquoi ce quart ?',content,(c)=>c(),'OK');
}
// ---- Édition manuelle d'un horaire généré ----------------------------------
// Recalcule les heures par employé à partir des quarts (après édition manuelle).
function recomputeHours(weeks){for(const wk of weeks){const eh={};for(const a of wk.result.assignments)eh[a.employeeId]=(eh[a.employeeId]||0)+(a.end-a.start);wk.result.employeeHours=eh;recomputeUnmet(wk);}}
// Recalcule les plages non couvertes + l'avertissement, à partir des quarts actuels.
function recomputeUnmet(wk){const unmet=[];for(const date of wk.weekDates){const dow=dayOfWeek(date);const cov=coverageForDate(date);
  for(const dept of DEPTS){const req=(cov[dept.key]&&cov[dept.key][dow])||{};const oh=state.openingHours[dept.key][dow];const shifts=wk.result.assignments.filter(a=>a.departmentId===dept.id&&a.date===date);
    for(const h of Object.keys(req).map(Number)){if(!oh||oh.closed||h<oh.open||h>=oh.close)continue; // couverture hors ouverture = ignorée
      let asg=0;for(const a of shifts)if(a.start<=h&&a.end>h)asg++;const miss=(req[h]||0)-asg;if(miss>0)unmet.push({date,departmentId:dept.id,hour:h,missing:miss});}}}
  wk.result.unmet=unmet;const warnings=[];if(unmet.length){const tm=unmet.reduce((s,u)=>s+u.missing,0);warnings.push(tm+' heure(s)-personne non couvertes sur '+unmet.length+' plage(s). Ajuste les disponibilités ou ajoute du personnel.');}wk.result.warnings=warnings;}
// Conflits (avertissements, non bloquants) pour un quart manuel.
function shiftConflicts(empId,date,s,e,dept,wk,excludeA){const out=[];const emp=state.employees.find(x=>x.id===empId);if(!emp)return out;const dow=dayOfWeek(date);
  for(const c of(state.timeOff||[]))if(c.employeeId===empId&&c.start<=date&&date<=(c.end||c.start)){out.push('en congé ce jour');break;}
  let wins=[...((emp.availability&&emp.availability[dow])||[])];for(const x of(state.extraAvail||[]))if(x.employeeId===empId&&x.date===date)wins.push({start:x.start,end:x.end});
  if(!wins.length)out.push('aucune disponibilité déclarée ce jour');else if(!wins.some(w=>w.start<=s&&w.end>=e))out.push('hors de sa disponibilité déclarée');
  const oh=state.openingHours[dept.key][dow];if(!oh||oh.closed)out.push('département fermé ce jour');else if(s<oh.open||e>oh.close)out.push('hors des heures d’ouverture');
  for(const a of wk.result.assignments){if(a===excludeA)continue;if(a.employeeId===empId&&a.date===date&&s<a.end&&e>a.start){out.push('chevauche un autre quart de cet employé');break;}}
  return out;}
// Disponibilité effective d'une semaine (base + alternance + dispos supp. + congés) — même logique que la génération.
function effectiveAvailability(ws){const weekDates=weekDatesFrom(ws);
  const availability={};for(const e of state.employees){availability[e.id]={};for(let d=0;d<7;d++)availability[e.id][d]=(e.availability&&e.availability[d])||[];}
  const timeOff=[];for(const c of(state.timeOff||[]))for(const date of weekDates)if(c.start<=date&&date<=(c.end||c.start))timeOff.push({employeeId:c.employeeId,date});
  const conge=new Set(timeOff.map(t=>t.employeeId+'|'+t.date));
  applyAlternance(availability,ws,weekDates,conge);
  for(const x of(state.extraAvail||[]))if(weekDates.indexOf(x.date)>=0){const dow=dayOfWeek(x.date);availability[x.employeeId]=availability[x.employeeId]||{};availability[x.employeeId][dow]=(availability[x.employeeId][dow]||[]).concat([{start:x.start,end:x.end}]);}

// Sélecteur d'employé trié par critères (dispo + rang), avec statut de chacun. Retourne {node,setTimes,get}.
function candidatePicker(dept,date,wk,initialId,excludeA){
  const dow=dayOfWeek(date);const ws=mondayOf(date);const avail=effectiveAvailability(ws);
  const emps=state.employees.filter(x=>empDoes(x,dept.key)&&x.active!==false);
  let selId=initialId||null,curS=0,curE=0;const listWrap=el('div',{class:'cand-list'});
  function statusOf(emp){const labels=[];let level='ok';
    const onConge=(state.timeOff||[]).some(c=>c.employeeId===emp.id&&c.start<=date&&date<=(c.end||c.start));
    if(onConge){labels.push('🌴 congé');level='block';}
    const wins=(avail[emp.id]&&avail[emp.id][dow])||[];
    let wkMin=0;if(wk)for(const x of wk.result.assignments){if(x===excludeA)continue;if(x.employeeId===emp.id)wkMin+=x.end-x.start;}
    const maxMin=(emp.maxHoursPerWeek??40)*60;
    if(curE>curS){
      if(!wins.length){labels.push('⚪ non dispo ce jour');if(level!=='block')level='warn';}
      else if(!wins.some(w=>w.start<=curS&&w.end>=curE)){labels.push('⚠ hors de sa dispo');if(level!=='block')level='warn';}
      if(wk)for(const x of wk.result.assignments){if(x===excludeA)continue;if(x.employeeId===emp.id&&x.date===date&&curS<x.end&&curE>x.start){labels.push('⛔ chevauche un quart');level='block';break;}}
      if(wkMin+(curE-curS)>maxMin){labels.push('⚠ dépasse '+(maxMin/60)+' h/sem');if(level!=='block')level='warn';}
    }
    if(level==='ok')labels.unshift('✅ dispo, sans conflit');

    scored.sort((x,y)=>ord[x.st.level]-ord[y.st.level]||(x.e.rank??99)-(y.e.rank??99));
    if((!selId||!emps.some(e=>e.id===selId))&&scored.length)selId=scored[0].e.id;
    for(const {e,st} of scored){const r=el('input',{type:'radio',name:'candpick',...(e.id===selId?{checked:true}:{})});r.addEventListener('change',()=>{selId=e.id;});
      listWrap.appendChild(el('label',{class:'cand-row '+st.level},r,
        el('span',{class:'cand-name'},e.firstName+' '+e.lastName),
        el('span',{class:'cand-meta'},'rang '+e.rank+' · '+(st.wkMin/60).toFixed(st.wkMin%60?1:0)+'/'+(st.maxMin/60)+' h'),
        el('span',{class:'cand-badges'},st.labels.join(' '))));}
    if(!scored.length)listWrap.appendChild(el('div',{class:'muted small',style:'padding:10px'},'Aucun employé ne fait '+dept.name+'.'));}
  return {node:listWrap,setTimes:(s,e)=>{curS=s;curE=e;render();},get:()=>selId};}
// Explique pourquoi les AUTRES employés n'ont pas eu ce quart précis.
function whyNotOthers(a,dept,date){
  const ws=mondayOf(date);const dow=dayOfWeek(date);const avail=effectiveAvailability(ws);
  const wk=(state.lastGenerated||[]).find(w=>w.ws===ws);
  const others=state.employees.filter(e=>e.id!==a.employeeId&&empDoes(e,dept.key)&&e.active!==false);
  const g={conge:[],nondispo:[],ailleurs:[],horsplage:[],dispo:[]};
  for(const e of others){const nm=e.firstName+' '+e.lastName;
    if((state.timeOff||[]).some(c=>c.employeeId===e.id&&c.start<=date&&date<=(c.end||c.start))){g.conge.push(nm);continue;}
    let elsew=null;if(wk)for(const x of wk.result.assignments){if(x.employeeId===e.id&&x.date===date){const dp=DEPTS.find(d=>d.id===x.departmentId);elsew=(dp?dp.name:x.departmentId)+' '+minutesToHHMM(x.start)+'–'+minutesToHHMM(x.end);break;}}
    if(elsew){g.ailleurs.push(nm+' ('+elsew+')');continue;}
    const wins=(avail[e.id]&&avail[e.id][dow])||[];
    if(!wins.length){g.nondispo.push(nm);continue;}
    if(!wins.some(w=>w.start<=a.start&&w.end>=a.end)){g.horsplage.push(nm);continue;}
    g.dispo.push(nm+' (rang '+e.rank+')');}
  const sec=el('div',{style:'margin-top:14px;border-top:1px solid var(--line);padding-top:10px'});
  sec.appendChild(el('div',{style:'font-weight:700;margin-bottom:6px'},'Pourquoi pas les autres ?'));
  const line=(emoji,label,arr)=>{if(arr.length)sec.appendChild(el('p',{style:'margin:6px 0'},emoji+' '+label+' : ',el('span',{class:'muted'},arr.join(', '))));};
  line('🌴','En congé ce jour',g.conge);
  line('⚪','Pas disponible ce jour (dispo/alternance)',g.nondispo);
  line('🔁','Déjà assignés ailleurs ce jour',g.ailleurs);
  line('⏰','Disponibles mais pas sur toute cette plage',g.horsplage);
  line('✅','Disponibles — non retenus car la couverture était déjà comblée (1 personne suffit, priorité au rang le plus fort)',g.dispo);
  if(!Object.values(g).some(arr=>arr.length))sec.appendChild(el('p',{class:'muted small'},'Aucun autre employé ne fait ce département.'));
  return sec;}

// Alternance : rotation déterministe d'une semaine à l'autre. Pour chaque
// (département, jour), les employés en alternance se relaient selon le numéro
// de semaine ; celui « de garde » garde sa disponibilité, les autres sont mis
// de côté cette semaine-là. Si le titulaire est en congé/indisponible, on prend
// le suivant dans la rotation ; s'il n'y en a qu'un, il travaille toujours.
function applyAlternance(availability,weekStart,weekDates,conge){
  const weekIndex=Math.floor(new Date(weekStart+'T00:00:00Z').getTime()/(7*86400000));
  const dateByDow={};for(const date of weekDates)dateByDow[dayOfWeek(date)]=date;
  const onTurn={};
  for(let dow=0;dow<7;dow++){const date=dateByDow[dow];
    for(const dept of DEPTS){
      const members=state.employees.filter(e=>e.active!==false&&empDoes(e,dept.key)&&e.availability&&e.availability[dow]&&e.availability[dow][0]&&e.availability[dow][0].alt).sort((a,b)=>a.rank-b.rank);
      const n=members.length;if(n===0)continue;const off=((weekIndex%n)+n)%n;
      for(let i=0;i<n;i++){const m=members[(off+i)%n];
        const dispo=availability[m.id]&&availability[m.id][dow]&&availability[m.id][dow].length>0&&!conge.has(m.id+'|'+date);
        if(dispo){onTurn[m.id+'|'+dow]=true;break;}}
    }
  }
  for(const e of state.employees){for(let dow=0;dow<7;dow++){const w=e.availability&&e.availability[dow]&&e.availability[dow][0];
    if(w&&w.alt&&!onTurn[e.id+'|'+dow]&&availability[e.id])availability[e.id][dow]=[];}}
}

// Prépare l'horaire pour Presto : noms à l'orthographe Presto, heures AM/PM,
// département en MAJUSCULES ; copie le tout dans le presse-papier.
function copyForPresto(weeks){
  const NAME_MAP={'Djefline Nouma':'Djefline Numa','Gabriella Di':'Gabriella Dee','Abygaelle Sirois':'Abygaëlle Sirois','Jezabel Depault':'Jézabel Depault'};
  const DEPTUP={kitchen:'CUISINE',service:'SERVICE',plonge:'PLONGE',hotesse:'HÔTESSE'};
  const empById=Object.fromEntries(state.employees.map(e=>[e.id,e]));
  const toPresto=(m)=>{let h=Math.floor(m/60),mm=m%60,ap=h<12?'AM':'PM',h12=h%12;if(h12===0)h12=12;return h12+':'+String(mm).padStart(2,'0')+' '+ap;};
  const shifts=[];
  for(const wk of weeks)for(const a of wk.result.assignments){const e=empById[a.employeeId];if(!e)continue;const full=e.firstName+' '+e.lastName;
    shifts.push({name:NAME_MAP[full]||full,date:a.date,start:toPresto(a.start),end:toPresto(a.end),position:DEPTUP[DEPTS.find(d=>d.id===a.departmentId).key]||''});}
  shifts.sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));

  state.prestoLog=state.prestoLog||[];
  state.prestoLog.unshift({id:uid(),copiedAt:nowStamp(),shifts:JSON.parse(JSON.stringify(shifts))});
  if(state.prestoLog.length>50)state.prestoLog.length=50;
  save();
  const json=JSON.stringify(shifts,null,2);
  const done=()=>toast(shifts.length+' quarts copiés (enregistrés dans « Envois Presto ») — va dans Presto et clique le favori « Importer dans Presto ».');
  function fallback(){const ta=el('textarea',{style:'position:fixed;left:-9999px'});ta.value=json;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(json).then(done).catch(fallback);else fallback();
}

const MOIS_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function frDateLong(s){const d=new Date(s+'T00:00:00Z');return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MOIS_FR[d.getUTCMonth()];}
// Fusionne les créneaux 30 min non couverts en plages continues, par département et jour.
function mergeUnmet(unmet){const byKey={};for(const u of unmet){const k=u.departmentId+'|'+u.date;(byKey[k]=byKey[k]||[]).push(u);}
  const out=[];for(const k of Object.keys(byKey)){const arr=byKey[k].slice().sort((a,b)=>a.hour-b.hour);const p=k.split('|');const departmentId=p[0],date=p[1];
    const ranges=[];let cur=null;for(const u of arr){if(cur&&u.hour===cur.end){cur.end=u.hour+30;cur.min=Math.min(cur.min,u.missing);cur.max=Math.max(cur.max,u.missing);}else{if(cur)ranges.push(cur);cur={start:u.hour,end:u.hour+30,min:u.missing,max:u.missing};}}
    if(cur)ranges.push(cur);out.push({departmentId,date,ranges});}
  return out;}
// Comble les trous d'une semaine avec d'AUTRES employés disponibles (jamais celui déjà présent ce jour-là).
// Respecte : disponibilité effective, congés, 1 quart/jour, heures max/sem., jours max/sem., heures d'ouverture.
function fillWeek(wk,onChange){
  const avail=effectiveAvailability(wk.ws);let added=0,guard=0;
  while(guard++<300){
    recomputeUnmet(wk);const periods=mergeUnmet(wk.result.unmet||[]);if(!periods.length)break;let placed=false;
    for(const per of periods){const dept=DEPTS.find(d=>d.id===per.departmentId);const dow=dayOfWeek(per.date);const oh=state.openingHours[dept.key][dow];if(!oh||oh.closed)continue;
      for(const r of per.ranges){
        const cands=state.employees.filter(e=>empDoes(e,dept.key)&&e.active!==false)
          .filter(e=>!(state.timeOff||[]).some(c=>c.employeeId===e.id&&c.start<=per.date&&per.date<=(c.end||c.start)))
          .filter(e=>!wk.result.assignments.some(a=>a.employeeId===e.id&&a.date===per.date)) // 1 quart/jour ET « pas la même personne »
          .filter(e=>{const days=new Set(wk.result.assignments.filter(a=>a.employeeId===e.id).map(a=>a.date));return days.size<(e.maxDaysPerWeek??7);})
          .filter(e=>{const wins=(avail[e.id]&&avail[e.id][dow])||[];return wins.some(w=>w.start<r.end&&w.end>r.start);})
          .sort((a,b)=>(a.rank??99)-(b.rank??99));
        if(!cands.length)continue;const e=cands[0];const wins=(avail[e.id]&&avail[e.id][dow])||[];
        let best=null;for(const w of wins){const s=Math.max(w.start,r.start,oh.open),en=Math.min(w.end,r.end,oh.close);if(en>s&&(!best||en-s>best.en-best.s))best={s,en};}
        if(!best)continue;
        let wkMin=0;for(const a of wk.result.assignments)if(a.employeeId===e.id)wkMin+=a.end-a.start;
        const maxMin=(e.maxHoursPerWeek??40)*60;if(wkMin+(best.en-best.s)>maxMin){best.en=best.s+(maxMin-wkMin);}
        if(best.en-best.s<30)continue; // rien d'utile à placer
        wk.result.assignments.push({employeeId:e.id,departmentId:dept.id,date:per.date,start:best.s,end:best.en,_edited:true,_filled:true});
        added++;placed=true;
      }
    }
    if(!placed)break;
  }
  onChange(added>0?(added+' quart(s) ajouté(s) pour combler les trous.'):'Aucun autre employé disponible pour combler les trous restants.');
}

    if(!empSel.value)throw new Error('Choisis un employé.');
    const dept=deptGet();if(!dept)throw new Error('Cet employé n’a aucun département.');
    const toAdd=[];
    for(const r of rows){if(!r.date.value)continue;const s=hhmmToMin(r.start.value),e=hhmmToMin(r.end.value);
      if(e<=s)throw new Error('L’heure de fin doit être après le début ('+r.date.value+').');
      toAdd.push({id:uid(),employeeId:empSel.value,department:dept,date:r.date.value,start:s,end:e});}
    if(!toAdd.length)throw new Error('Ajoute au moins une disponibilité.');
    state.extraAvail.push(...toAdd);save();toast(toAdd.length+' disponibilité(s) ajoutée(s).');close();route();},'Enregistrer');
}

// ---- Vue : Envois Presto (rapport de ce qui a été copié pour Presto) --------
function posClass(p){return {SERVICE:'service',CUISINE:'kitchen',PLONGE:'plonge','HÔTESSE':'hotesse'}[p]||'service';}
function copyBatchText(batch){const byWeek={};for(const s of batch.shifts){const wk=mondayOf(s.date);(byWeek[wk]=byWeek[wk]||[]).push(s);}
  const lines=[];for(const wk of Object.keys(byWeek).sort()){lines.push('Semaine du '+wk);
    for(const s of byWeek[wk].slice().sort((a,b)=>a.date.localeCompare(b.date))) lines.push('  '+DOW[dayOfWeek(s.date)]+' '+s.date+' · '+s.name+' · '+s.start+'-'+s.end+' · '+s.position);lines.push('');}
  const txt=lines.join('\n');const done=()=>toast('Liste copiée.');
  function fb(){const ta=el('textarea',{style:'position:fixed;left:-9999px'});ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(fb);else fb();}
function viewPrestoLog(){
  const root=el('div',{});const log=state.prestoLog||[];
  root.appendChild(el('div',{class:'page-head'},
    el('div',{},el('h1',{},'Envois Presto'),el('p',{},'Quarts copiés pour Presto, par envoi et par semaine — utilise-les pour retrouver et retirer des quarts dans Presto.')),
    log.length?el('button',{class:'danger',onClick:()=>{if(confirm('Effacer TOUT l’historique des envois ?')){state.prestoLog=[];save();route();}}},'Tout effacer'):null));
  root.appendChild(el('div',{class:'warn-box'},'⚠ Ce rapport n’agit pas sur Presto : « Retirer » efface seulement la ligne de l’historique ici, pas le quart dans Presto. Sers-t’en comme référence pour supprimer les quarts toi-même dans Presto.'));
  if(!log.length){root.appendChild(el('div',{class:'panel muted'},'Aucun envoi pour l’instant. L’historique se remplit à chaque clic sur « 📋 Copier pour Presto ».'));return root;}
  for(const batch of log){
    const byWeek={};for(const s of batch.shifts){const wk=mondayOf(s.date);(byWeek[wk]=byWeek[wk]||[]).push(s);}
    const weeks=Object.keys(byWeek).sort();const panel=el('div',{class:'panel'});
    panel.appendChild(el('div',{class:'row',style:'align-items:center;margin-bottom:6px'},
      el('h2',{style:'margin:0'},'Envoi du '+batch.copiedAt),
      el('span',{class:'muted small',style:'margin-left:8px'},batch.shifts.length+' quart(s) · '+weeks.length+' semaine(s)'),
      el('div',{class:'spacer'}),
      el('button',{class:'sm',onClick:()=>copyBatchText(batch)},'Copier la liste'),
      el('button',{class:'sm danger',onClick:()=>{if(confirm('Retirer cet envoi de l’historique ?')){state.prestoLog=state.prestoLog.filter(x=>x.id!==batch.id);save();route();}}},'Retirer')));
    for(const wk of weeks){
      panel.appendChild(el('div',{class:'small',style:'font-weight:700;margin:10px 0 4px'},'Semaine du '+wk));
      const t=el('table',{},el('thead',{},el('tr',{},el('th',{},'Jour'),el('th',{},'Date'),el('th',{},'Employé'),el('th',{},'Heure'),el('th',{},'Poste'))));
      const tb=el('tbody',{});
      for(const s of byWeek[wk].slice().sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name)))
        tb.appendChild(el('tr',{},el('td',{},DOW[dayOfWeek(s.date)]),el('td',{},s.date),el('td',{},s.name),el('td',{class:'small'},s.start+' – '+s.end),el('td',{},el('span',{class:'tag '+posClass(s.position)},s.position))));
      t.appendChild(tb);panel.appendChild(el('div',{class:'cov-grid'},t));
    }
    root.appendChild(panel);
  }
  return root;}

// ---- Vue : Modèles de quarts récurrents ------------------------------------
function editTemplate(tpl,isNew){
  const label=el('input',{value:tpl.label||'',placeholder:'ex. Fermeture Service'});
  const dsel=el('select',{},...DEPTS.map(d=>el('option',{value:d.key,...(d.key===(tpl.deptKey||'service')?{selected:true}:{})},d.name)));
  const start=el('input',{type:'time',value:minutesToHHMM(tpl.start??660)}),end=el('input',{type:'time',value:minutesToHHMM(tpl.end??1320)});
  const content=el('div',{},el('label',{class:'field'},'Nom du modèle',label),
    el('div',{class:'row',style:'margin-top:10px'},el('label',{class:'field'},'Département',dsel),el('label',{class:'field'},'Début',start),el('label',{class:'field'},'Fin',end)));
  modal(isNew?'Nouveau modèle':'Modifier le modèle',content,(close)=>{
    if(!label.value.trim())throw new Error('Donne un nom au modèle.');
    const s=hhmmToMin(start.value),e=hhmmToMin(end.value);if(!(e>s))throw new Error('La fin doit être après le début.');
    const data={label:label.value.trim(),deptKey:dsel.value,start:s,end:e};
    if(isNew){data.id=uid();state.shiftTemplates.push(data);}else Object.assign(tpl,data);
    save();toast('Modèle enregistré.');close();route();});
}
function viewTemplates(){
  const root=el('div',{});
  root.appendChild(el('div',{class:'page-head'},el('div',{},el('h1',{},'Modèles de quarts'),el('p',{},'Blocs horaires réutilisables (ex. « Ouverture 11–16 »). Sers-t’en pour remplir un quart en un clic depuis l’horaire (« + quart » → Modèle).')),
    el('button',{class:'primary',onClick:()=>editTemplate({},true)},'+ Nouveau modèle')));
  const list=[...(state.shiftTemplates||[])];
  if(!list.length){root.appendChild(el('div',{class:'panel muted'},'Aucun modèle. Clique « + Nouveau modèle » pour créer un bloc horaire réutilisable.'));return root;}
  for(const dept of DEPTS){const rows=list.filter(t=>t.deptKey===dept.key).sort((a,b)=>a.start-b.start);if(!rows.length)continue;
    const t=el('table',{},el('thead',{},el('tr',{},el('th',{},'Modèle'),el('th',{},'Heures'),el('th',{},'Durée'),el('th',{},''))));
    const tb=el('tbody',{});
    for(const tp of rows)tb.appendChild(el('tr',{},el('td',{},tp.label),el('td',{},minutesToHHMM(tp.start)+'–'+minutesToHHMM(tp.end)),el('td',{class:'small muted'},((tp.end-tp.start)/60).toFixed(((tp.end-tp.start)%60)?1:0)+' h'),
      el('td',{class:'right'},el('button',{class:'sm',onClick:()=>editTemplate(tp,false)},'Modifier'),' ',
        el('button',{class:'sm danger',onClick:()=>{if(confirm('Supprimer le modèle « '+tp.label+' » ?')){state.shiftTemplates=state.shiftTemplates.filter(x=>x.id!==tp.id);save();route();}}},'Suppr.'))));
    t.appendChild(tb);
    root.appendChild(el('div',{class:'panel'},el('h2',{},el('span',{class:'tag '+dept.key},dept.name)),t));
  }
  return root;
}
// ---- Navigation ------------------------------------------------------------
const ROUTES=[{id:'horaire',label:'Horaire',icon:'🗓️',render:viewSchedule},{id:'employes',label:'Employés',icon:'👥',render:viewEmployees},{id:'conges',label:'Congés',icon:'🌴',render:viewTimeOff},{id:'dispsupp',label:'Disp. supp.',icon:'➕',render:viewExtraAvail},{id:'modeles',label:'Modèles de quarts',icon:'🧩',render:viewTemplates},{id:'heures',label:"Heures d'ouverture",icon:'🕐',render:viewHours},{id:'couverture',label:'Couverture',icon:'📊',render:viewCoverage},{id:'envois',label:'Envois Presto',icon:'📤',render:viewPrestoLog}];
const nav=document.getElementById('nav');
for(const r of ROUTES)nav.appendChild(el('a',{href:'#'+r.id,'data-route':r.id},r.icon+'  '+r.label));
function route(){const id=(location.hash||'#horaire').slice(1);const r=ROUTES.find(x=>x.id===id)||ROUTES[0];
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('data-route')===r.id));

// ---- Export / Import / Reset ----------------------------------------------
document.getElementById('btnExport').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=el('a',{href:url,download:'horaire-ia-donnees.json'});document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Données exportées.');});
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change',(ev)=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{state=normalize(JSON.parse(rd.result));save();toast('Données importées.');route();}catch(e){toast('Fichier invalide.',true);}};rd.readAsText(f);});
document.getElementById('btnReset').addEventListener('click',()=>{if(confirm('Recharger les données de démonstration ? Tes modifications locales seront écrasées.'))resetDemo();});

// ============================================================================
//  Synchronisation serveur (version web hébergée) — données partagées + login.
//  En version fichier local (sans serveur), tout retombe sur localStorage.
// ============================================================================
let _saveTimer=null,_serverOK=false;
function serverSave(){
  if(!_serverOK)return; // pas de serveur (fichier local) → localStorage seulement
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}).then(r=>{if(r.status===401)showLogin();}).catch(()=>{});},600);
}
function showLogin(){
  if(document.getElementById('ait-login'))return;
  const ov=document.createElement('div');ov.id='ait-login';
  ov.style.cssText='position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:2147483647';
  ov.innerHTML='<div style="background:#fff;border-radius:12px;padding:26px 24px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:sans-serif"><div style="font-size:20px;font-weight:700;margin-bottom:4px">AI-TIMING</div><div style="color:#64748b;font-size:13px;margin-bottom:16px">Entre le mot de passe pour accéder à l’horaire.</div><input id="ait-pw" type="password" placeholder="Mot de passe" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"/><div id="ait-err" style="color:#dc2626;font-size:12px;height:16px;margin:6px 0"></div><button id="ait-go" style="width:100%;background:#4f46e5;color:#fff;border:0;padding:11px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer">Entrer</button></div>';
  document.body.appendChild(ov);
  const pw=document.getElementById('ait-pw'),err=document.getElementById('ait-err');pw.focus();
  const go=()=>{err.textContent='';fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})}).then(r=>{if(r.ok){ov.remove();boot();}else{err.textContent='Mot de passe incorrect.';pw.value='';pw.focus();}}).catch(()=>{err.textContent='Erreur de connexion.';});};
  document.getElementById('ait-go').onclick=go;pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}
async function boot(){
  // Détecte la présence d'un serveur : si /api/me répond, on est en mode web.
  let me;try{me=await fetch('/api/me').then(r=>r.ok?r.json():null);}catch(e){me=null;}
  if(!me){_serverOK=false;route();return;} // pas de serveur → mode fichier local (localStorage)
  _serverOK=true;
  if(!me.authed){showLogin();return;}
  try{
    const res=await fetch('/api/state');
    if(res.status===401){showLogin();return;}
    const data=await res.json();
    if(data&&Object.keys(data).length&&!data.__empty){state=normalize(data);}
    else{await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});} // 1re fois : on pousse l'état courant
  }catch(e){}
  route();
}
boot();
